name: Bug report
description: Something does not work the way the README says
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command line you ran. Replace private profile, instance and cluster names if you like.
      placeholder: ssm-commander connect web-1 -p prod
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: >-
        Paste the output, including the error line and its hint. For an unexpected error, run the command again
        with --debug and include the stack trace. Never paste access keys, session tokens or MFA codes.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of ssm-commander doctor
      description: >-
        Run `ssm-commander doctor -p <profile>` and paste the result; account ids and ARNs can be replaced by
        placeholders. For a problem with exec or forward --target ecs:, add `--ecs <cluster>/<service>`.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: >-
        OS and version, how ssm-commander was installed (Homebrew, npm or npx), and the versions of Node.js and
        session-manager-plugin (doctor prints both).
      placeholder: macOS 26.1, Homebrew, Node.js 24.11.0, session-manager-plugin 1.2.707.0
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        The platform of the target (Ubuntu, Amazon Linux, Fargate), whether the profile uses MFA or SSO, the
        terminal and shell, and whether this worked before.
